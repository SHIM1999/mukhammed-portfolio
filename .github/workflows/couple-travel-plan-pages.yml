name: Deploy Couple Travel Plan

on:
  push:
    branches: [main]
    paths:
      - "couple-travel-plan/**"
      - ".github/workflows/couple-travel-plan-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: couple-travel-plan-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: couple-travel-plan

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
